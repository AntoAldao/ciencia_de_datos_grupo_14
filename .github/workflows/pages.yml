# Publica la carpeta site/ (la página estática que genera build_app.py) en GitHub Pages.
# No construye nada: sube el index.html que ya está commiteado.
# Requiere, una sola vez: Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Va en dos trabajos, como recomienda GitHub: uno sube la página y el otro la publica recién
# cuando la subida terminó. Con todo en un mismo trabajo y las versiones viejas de las acciones,
# la publicación a veces no encontraba lo subido («No artifacts named "github-pages" were found»).
name: Publicar la página en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: subir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
